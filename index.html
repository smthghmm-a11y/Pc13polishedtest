<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10182e" />
    <title>PC13 — Attendance, thoughtfully tracked</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #fff;
        --ink: #101828;
        --muted: #667085;
        --line: #e4e8f0;
        --navy: #10182e;
        --violet: #7659ef;
        --violet2: #a797ff;
        --teal: #28b8a6;
        --green: #18a673;
        --yellow: #d98c18;
        --red: #d95d67;
        --shadow: 0 16px 45px rgba(20, 31, 62, 0.09);
        --r: 20px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
      }
      .hidden {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--violet);
      }
      .btn {
        border-radius: 11px;
        padding: 11px 15px;
        font-size: 12px;
        font-weight: 800;
        transition: 0.2s;
      }
      .primary {
        background: var(--violet);
        color: #fff;
        box-shadow: 0 8px 18px #7659ef3b;
      }
      .primary:hover {
        background: #6044dd;
        transform: translateY(-1px);
      }
      .secondary {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .secondary:hover {
        border-color: #bcaeff;
        color: var(--violet);
      }
      .danger {
        background: #ffebed;
        color: var(--red);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
      }
      .pad {
        padding: 22px;
      }
      .field {
        display: grid;
        gap: 7px;
      }
      .field label {
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fff;
        color: var(--ink);
        outline: 0;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: #a797ff;
        box-shadow: 0 0 0 3px #eeeaff;
      }
      .field textarea {
        min-height: 90px;
        resize: vertical;
      }
      .grid {
        display: grid;
        gap: 18px;
      }
      .two {
        grid-template-columns: 1fr 1fr;
      }
      .three {
        grid-template-columns: repeat(3, 1fr);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 13px;
      }
      .full {
        grid-column: 1/-1;
      }
      .auth {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.03fr 0.97fr;
        background: var(--navy);
        color: #fff;
      }
      .auth-art {
        padding: 7vw;
        display: flex;
        justify-content: center;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, #7659ef3b, transparent 38%),
          linear-gradient(145deg, #1c2b55, #10182e);
      }
      .auth-art:before,
      .auth-art:after {
        content: "";
        position: absolute;
        border: 1px solid #ffffff1b;
        border-radius: 50%;
      }
      .auth-art:before {
        width: 470px;
        height: 470px;
        right: -145px;
        top: 8%;
        box-shadow:
          0 0 0 35px #ffffff06,
          0 0 0 75px #ffffff04;
      }
      .auth-art:after {
        width: 210px;
        height: 210px;
        left: -120px;
        bottom: -40px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, #8a73ff, #36d0bb);
        display: grid;
        place-items: center;
        font-weight: 900;
        box-shadow: 0 8px 22px #7659ef4d;
      }
      .brand strong {
        font-size: 19px;
      }
      .brand small {
        display: block;
        color: #9ba7c2;
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 2px;
      }
      .auth-brand {
        position: absolute;
        top: 32px;
        left: 7vw;
      }
      .auth-art h1 {
        font-size: clamp(40px, 5.5vw, 78px);
        line-height: 0.98;
        letter-spacing: -0.075em;
        max-width: 700px;
        margin: 25px 0 18px;
        position: relative;
        z-index: 1;
      }
      .auth-art h1 span {
        color: var(--violet2);
      }
      .auth-art p {
        max-width: 470px;
        color: #aeb9d3;
        line-height: 1.65;
        font-size: 14px;
        position: relative;
        z-index: 1;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 25px;
        position: relative;
        z-index: 1;
      }
      .chips span {
        padding: 9px 12px;
        border-radius: 999px;
        background: #ffffff12;
        color: #d2d9e9;
        font-size: 10px;
      }
      .auth-panel {
        background: #fff;
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 35px 7vw;
      }
      .auth-box {
        width: min(100%, 440px);
        animation: in 0.45s ease both;
      }
      .auth-box h2 {
        margin: 8px 0 6px;
        font-size: 29px;
        letter-spacing: -0.06em;
      }
      .auth-box > p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
        margin: 0 0 22px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        background: #f0f2f7;
        border-radius: 12px;
        margin-bottom: 19px;
      }
      .tabs button {
        flex: 1;
        background: transparent;
        border-radius: 9px;
        padding: 9px;
        color: var(--muted);
        font-weight: 800;
        font-size: 11px;
      }
      .tabs button.active {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 4px 12px #141f3d12;
      }
      .auth-form {
        display: grid;
        gap: 14px;
      }
      .auth-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 4px;
      }
      .notice {
        padding: 12px 13px;
        background: #f4f1ff;
        color: #6256b7;
        border-radius: 11px;
        font-size: 11px;
        line-height: 1.5;
      }
      .notice.warn {
        background: #fff5df;
        color: #9b6715;
      }
      .notice.error {
        background: #ffebed;
        color: #a93443;
      }
      .setup {
        border: 1px dashed #c6baff;
        background: #faf9ff;
        padding: 13px;
        border-radius: 13px;
        font-size: 11px;
        line-height: 1.5;
      }
      .setup strong {
        display: block;
        margin-bottom: 4px;
      }
      .app {
        min-height: 100vh;
        display: flex;
      }
      .side {
        width: 258px;
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 30;
        background: linear-gradient(180deg, #10182e, #16213e);
        color: #fff;
        padding: 27px 18px;
        display: flex;
        flex-direction: column;
        transition: 0.25s;
      }
      .side .brand {
        padding: 0 11px 35px;
      }
      .nav-label {
        color: #8390ad;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 0 12px 12px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav button {
        background: transparent;
        color: #a9b4cf;
        padding: 13px;
        border-radius: 12px;
        text-align: left;
        display: flex;
        gap: 13px;
        align-items: center;
      }
      .nav button:hover,
      .nav button.active {
        background: #ffffff12;
        color: #fff;
      }
      .nav button.active {
        box-shadow: inset 3px 0 var(--violet2);
      }
      .side-foot {
        margin-top: auto;
        background: #ffffff0d;
        border-radius: 15px;
        padding: 14px;
        font-size: 11px;
        color: #d9e0f0;
      }
      .side-foot small {
        display: block;
        color: #8d9ab6;
        margin-top: 3px;
      }
      .main-wrap {
        margin-left: 258px;
        width: calc(100% - 258px);
        min-width: 0;
      }
      .top {
        height: 78px;
        padding: 0 4.5vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f5f7fbe8;
        backdrop-filter: blur(14px);
        border-bottom: 1px solid #e4e8f0a8;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .top h1 {
        font-size: 18px;
        margin: 0;
        letter-spacing: -0.04em;
      }
      .top p {
        font-size: 12px;
        color: var(--muted);
        margin: 4px 0 0;
      }
      .top-title {
        display: flex;
        align-items: center;
      }
      .mobile {
        display: none;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid var(--line);
        margin-right: 10px;
      }
      .top-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .icon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffe0cc, #ffd4ec);
        color: #704536;
        font-weight: 900;
        border: 3px solid #fff;
      }
      .main {
        padding: 28px 4.5vw 55px;
        max-width: 1600px;
        margin: auto;
      }
      .view {
        animation: in 0.3s ease both;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .welcome {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      .welcome h2 {
        font-size: clamp(28px, 3vw, 40px);
        letter-spacing: -0.06em;
        line-height: 1.05;
        margin: 7px 0 9px;
      }
      .welcome p {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }
      .date {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 11px 12px;
        color: var(--ink);
      }
      .hero {
        padding: 25px;
        min-height: 280px;
        color: #fff;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(circle at 90% 10%, #a797ff99, transparent 35%),
          linear-gradient(140deg, #1b2c56, #111a34 68%);
      }
      .hero:after,
      .profile-hero:after {
        content: "";
        position: absolute;
        width: 270px;
        height: 270px;
        border: 1px solid #ffffff20;
        border-radius: 50%;
        right: -80px;
        bottom: -125px;
        box-shadow:
          0 0 0 25px #ffffff08,
          0 0 0 50px #ffffff05;
      }
      .hero h3 {
        margin: 9px 0 4px;
        font-size: 24px;
        letter-spacing: -0.05em;
      }
      .hero p {
        color: #adbad5;
        margin: 0;
        font-size: 12px;
      }
      .hero-row {
        display: flex;
        align-items: center;
        gap: 33px;
        margin-top: 26px;
        position: relative;
        z-index: 1;
      }
      .ring {
        width: 145px;
        height: 145px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
        background: conic-gradient(var(--teal) var(--pct), #ffffff1c 0);
        position: relative;
      }
      .ring:before {
        content: "";
        position: absolute;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        background: #172545;
      }
      .ring-content {
        position: relative;
        text-align: center;
      }
      .ring strong {
        font-size: 27px;
        display: block;
        letter-spacing: -0.06em;
      }
      .ring span {
        font-size: 10px;
        color: #a8b5d1;
      }
      .hero-stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px 28px;
      }
      .hero-stat span {
        display: block;
        color: #9eabc7;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .hero-stat strong {
        font-size: 21px;
        display: block;
        letter-spacing: -0.05em;
        margin-top: 3px;
      }
      .hero-stat small {
        color: #91d9c9;
        font-size: 10px;
      }
      .today {
        padding: 22px;
      }
      .today-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 17px;
      }
      .today-head strong {
        font-size: 20px;
        letter-spacing: -0.05em;
      }
      .today-head span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
      }
      .pill {
        display: inline-flex;
        padding: 6px 9px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
      .safe {
        color: var(--green);
        background: #e8f8f2;
      }
      .careful {
        color: var(--yellow);
        background: #fff5df;
      }
      .recovery {
        color: var(--red);
        background: #ffebed;
      }
      .schedule {
        display: grid;
        gap: 10px;
      }
      .event {
        display: grid;
        grid-template-columns: 60px minmax(0, 1fr) auto;
        gap: 11px;
        align-items: center;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 15px;
        transition: 0.2s;
      }
      .event:hover {
        border-color: #c6baff;
        box-shadow: 0 7px 18px #7659ef12;
      }
      .event.now {
        background: #faf9ff;
        border-color: #a797ff;
      }
      .time {
        font-size: 10px;
        line-height: 1.45;
        color: var(--muted);
      }
      .event strong {
        display: block;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .event small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-top: 3px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 3px;
        background: var(--violet);
        display: inline-block;
        margin-right: 7px;
      }
      .event-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .event-actions .btn {
        padding: 7px 9px;
        font-size: 10px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        padding: 25px 10px;
      }
      .metric-grid {
        grid-template-columns: repeat(4, 1fr);
        margin-top: 18px;
      }
      .metric {
        padding: 17px;
        min-height: 112px;
      }
      .metric b {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: #f0edff;
        color: var(--violet);
        font-size: 15px;
        margin-bottom: 13px;
      }
      .metric:nth-child(2) b {
        background: #e7faf7;
        color: var(--teal);
      }
      .metric:nth-child(3) b {
        background: #fff3dc;
        color: var(--yellow);
      }
      .metric:nth-child(4) b {
        background: #ffecef;
        color: var(--red);
      }
      .metric span {
        font-size: 10px;
        color: var(--muted);
      }
      .metric strong {
        display: block;
        margin-top: 5px;
        font-size: 20px;
        letter-spacing: -0.05em;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 17px;
      }
      .section-head h3 {
        margin: 0;
        font-size: 16px;
        letter-spacing: -0.04em;
      }
      .section-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 11px;
      }
      .link {
        background: transparent;
        color: var(--violet);
        font-weight: 800;
        font-size: 11px;
      }
      .wide {
        margin-top: 18px;
      }
      .subject-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 13px;
      }
      .subject {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 15px;
        cursor: pointer;
        transition: 0.2s;
      }
      .subject:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
        border-color: #c6baff;
      }
      .subject-top {
        display: flex;
        justify-content: space-between;
        gap: 7px;
      }
      .subject h4 {
        font-size: 12px;
        line-height: 1.3;
        margin: 0;
      }
      .subject .type {
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 4px;
      }
      .subject .percent {
        font-size: 19px;
        font-weight: 900;
        letter-spacing: -0.05em;
      }
      .subject .counts {
        font-size: 10px;
        color: var(--muted);
        margin-top: 12px;
      }
      .progress {
        height: 7px;
        border-radius: 999px;
        background: #edf0f5;
        overflow: hidden;
        margin-top: 9px;
      }
      .progress i {
        height: 100%;
        display: block;
        border-radius: inherit;
        background: var(--green);
      }
      .subject.careful .progress i {
        background: var(--yellow);
      }
      .subject.recovery .progress i {
        background: var(--red);
      }
      .bar {
        height: 155px;
        display: flex;
        align-items: end;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 12px 5px 0;
      }
      .bar-col {
        flex: 1;
        text-align: center;
        height: 100%;
        display: flex;
        justify-content: end;
        flex-direction: column;
        gap: 6px;
      }
      .bar-col i {
        display: block;
        max-width: 34px;
        width: 100%;
        margin: auto;
        background: linear-gradient(#a797ff, #6949e8);
        border-radius: 7px 7px 0 0;
        min-height: 4px;
        animation: grow 0.7s ease both;
        transform-origin: bottom;
      }
      .bar-col label,
      .bar-col em {
        font-size: 9px;
        color: var(--muted);
        font-style: normal;
      }
      .page-title {
        margin-bottom: 24px;
      }
      .page-title h2 {
        font-size: 30px;
        letter-spacing: -0.06em;
        margin: 7px 0;
      }
      .page-title p {
        font-size: 12px;
        color: var(--muted);
        margin: 0;
      }
      .detail-layout {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
      }
      .detail-hero {
        display: flex;
        align-items: center;
        gap: 25px;
        padding: 22px;
      }
      .detail-hero .ring {
        width: 130px;
        height: 130px;
      }
      .detail-hero .ring:before {
        width: 97px;
        height: 97px;
        background: #fff;
      }
      .detail-hero .ring strong {
        color: var(--ink);
      }
      .detail-hero .ring span {
        color: var(--muted);
      }
      .detail-hero h3 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      .detail-hero p {
        font-size: 11px;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        min-width: 650px;
        font-size: 11px;
      }
      .table th {
        font-size: 9px;
        color: var(--muted);
        text-align: left;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      .table td {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }
      .table tr:hover td {
        background: #faf9ff;
      }
      .history {
        display: grid;
      }
      .history-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
      }
      .history-row:last-child {
        border-bottom: 0;
      }
      .history-row strong {
        font-size: 11px;
      }
      .history-row small {
        display: block;
        color: var(--muted);

          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",

      function localDate() {
        const d = new Date();
        return [
          d.getFullYear(),
          String(d.getMonth() + 1).padStart(2, "0"),
          String(d.getDate()).padStart(2, "0"),
        ].join("-");

      function parseDate(x) {
        const [y, m, d] = x.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function dateText(x) {
        return parseDate(x).toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric",

      function mins(x) {
        const [h, m] = x.split(":").map(Number);
        return h * 60 + m;

        return `<section class="view"><div class="page-title"><div class="eyebrow">Attendance up to date</div><h2>Attendance Up to Date</h2><p>Only completed, recorded sessions through today are counted. Future timetable entries are schedule information only.</p></div><div class="card detail-hero"><div class="ring" style="--pct:${o.pct == null ? 0 : o.pct}%"><div class="ring-content"><strong>${pct}</strong><span>${o.attended} / ${o.conducted}</span></div></div><div><h3>${o.conducted ? "Cumulative attendance" : "No attendance records yet"}</h3><p>${o.conducted ? `${o.attended} attended · ${o.conducted} conducted` : "Mark Present or Absent after a class actually happens."}</p><span class="pill ${o.pct == null ? "careful" : cls(o.pct)}">${o.conducted ? (o.pct >= 75 ? "Good" : o.pct >= 65 ? "Watch" : "Recovery") : "Not started"}</span></div></div><div class="grid two wide"><div class="card pad"><div class="section-head"><div><h3>Lecture and lab counts</h3><p>Every lecture and lab is one attendance unit.</p></div></div><div class="history-row"><span>Lectures</span><b>${types.lecture.attended} / ${types.lecture.conducted}${types.lecture.pct == null ? "" : " · " + pctText(types.lecture.pct)}</b></div><div class="history-row"><span>Labs</span><b>${types.lab.attended} / ${types.lab.conducted}${types.lab.pct == null ? "" : " · " + pctText(types.lab.pct)}</b></div><div class="notice" style="margin-top:14px">Formula: Total Attended ÷ Total Conducted × 100.</div></div><div class="card pad"><div class="section-head"><div><h3>Current month schedule reference</h3><p>Scheduled sessions do not affect the percentage until recorded.</p></div></div><div class="history-row"><span>${esc(currentMonth)}</span><b>${scheduledSessionsForMonth(currentMonth)} scheduled</b></div><div class="history-row"><span>Recorded this month</span><b>${monthly.find((m) => m.month === currentMonth)?.conducted || 0} conducted</b></div></div></div><div class="card pad wide"><div class="section-head"><div><h3>Subject and lab attendance</h3><p>Each subject uses its own raw Attended / Conducted counts.</p></div></div><div class="subject-grid">${subjectCards()}</div></div><div class="card pad wide"><div class="section-head"><div><h3>Monthly attendance history</h3><p>Monthly percentages are informational; cumulative attendance uses raw counts.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Attended</th><th>Conducted</th><th>Attendance</th></tr></thead><tbody>${monthly.length ? monthly.map((m) => `<tr><td>${esc(m.month)}</td><td>${m.attended}</td><td>${m.conducted}</td><td>${pctText(m.pct)}</td></tr>`).join("") : `<tr><td colspan="4" class="muted">No monthly attendance records yet.</td></tr>`}</tbody></table></div></div><div class="card pad wide"><div class="section-head"><div><h3>Daily records</h3><p>Legacy Cancelled records are treated as Not Conducted and do not count.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Subject</th><th>Type</th><th>Conducted</th><th>Attendance</th></tr></thead><tbody>${records.length ? [...records].sort((a,b) => String(b.date||"").localeCompare(String(a.date||""))).map((r) => { const n = normalizeAttendanceRecord(r); return `<tr><td>${esc(n.date || "")}</td><td>${esc(n.subject_name || n.subjectName || "")}</td><td>${esc(n.type || n.event_type || "lecture")}</td><td>${n.conducted_status === "conducted" ? "Yes" : "No"}</td><td class="${n.attendance_status === "present" ? "present" : n.attendance_status === "absent" ? "absent" : "pending"}">${n.attendance_status === "present" ? "Present" : n.attendance_status === "absent" ? "Absent" : "Not Conducted"}</td></tr>`; }).join("") : `<tr><td colspan="5" class="muted">No attendance records yet.</td></tr>`}</tbody></table></div></div></section>`;
      }
      eventCard = function (e, index = 0) {
        const date = selectedDate || localDate(), r = records.find((x) => (x.timetable_event_id || x.event_id || x.eventId) === e.id && x.date === date), n = r ? normalizeAttendanceRecord(r) : null, type = e.event_type || e.type || "lecture", suffix = index === 0 ? "st" : index === 1 ? "nd" : index === 2 ? "rd" : "th";
        return `<div class="event"><div class="time"><b>${index + 1}${suffix} Hr</b><br>${esc(e.start_time || "")}<br>${esc(e.end_time || "")}</div><div><strong><i class="dot"></i>${esc(e.subject_name || "Untitled class")}</strong><small>${type === "lab" ? "Lab" : "Class"}${e.room ? " · " + esc(e.room) : ""}</small></div><div class="event-actions">${n ? `<span class="${n.attendance_status === "present" ? "present" : n.attendance_status === "absent" ? "absent" : "pending"}" style="font-size:10px;font-weight:900">${n.attendance_status === "present" ? "✓ Present" : n.attendance_status === "absent" ? "✕ Absent" : "Not Conducted"}</span>` : `<button class="btn primary" data-open-event="${esc(e.id)}">Open</button>`}</div></div>`;
      };
      saveRecord = async function (e, status, conductedStatus, dateArg, silent = false) {
        const date = dateArg || selectedDate || localDate(), safeStatus = status === "present" || status === "absent" ? status : "pending", safeConducted = safeStatus === "present" || safeStatus === "absent" ? "conducted" : "not_conducted";
        if (isEditable(date)) return toast("This date remains editable.", "warn");
        if (holidayFor(date)?.type === "college") return toast("College holidays do not accept attendance marks.", "warn");
        const payload = { timetable_event_id: e.id, event_id: e.id, date, subject_id: e.subject_id || e.subjectId, subject_name: e.subject_name || e.subjectName, event_type: e.event_type || e.type || "lecture", type: e.type || e.event_type || "lecture", start_time: e.start_time || e.startTime, end_time: e.end_time || e.endTime, status: safeStatus, attendance_status: safeStatus, conducted: safeConducted === "conducted", conducted_status: safeConducted };
        const old = records.find((r) => r.date === date && (r.timetable_event_id || r.event_id || r.eventId) === e.id), result = old ? await db(CFG.tables.records, "update", payload, old.id) : await db(CFG.tables.records, "insert", payload);
        if (result) { const clean = normalizeAttendanceRecord(result); if (old) Object.assign(old, clean); else records.push(clean); if (!silent) { toast(safeStatus === "present" ? "Attendance saved as present." : safeStatus === "absent" ? "Attendance saved as absent." : "Class marked not conducted."); render(); } }
        return result;
      };
      eventModal = function (id) {
        const date = selectedDate || localDate(), e = effectiveEventsFor(date).find((x) => x.id === id); if (!e) return;
        const old = records.find((r) => r.date === date && (r.timetable_event_id || r.event_id || r.eventId) === id), editable = isEditable(date);
        openModal(`<div class="modal-head"><h3>${esc(e.subject_name || e.subjectName)}</h3><button class="icon" id="close-modal">×</button></div><div class="modal-body"><div class="eyebrow">${dateText(date)}</div><h2 style="margin:8px 0;font-size:25px">${esc(e.start_time || "")}–${esc(e.end_time || "")}</h2><p class="muted" style="font-size:12px">${esc(e.type || "lecture")}${e.room ? " · " + esc(e.room) : ""}</p><div class="notice" style="margin-top:16px">${editable ? "This date remains editable for attendance entry and correction." : "Choose a result after the class has actually happened."}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="btn primary" data-attend="present" ${editable ? "disabled" : ""}>✓ PRESENT</button><button class="btn danger" data-attend="absent" ${editable ? "disabled" : ""}>✕ ABSENT</button><button class="btn secondary" data-attend="pending" ${editable ? "disabled" : ""}>Not Conducted</button></div>${old ? `<p class="muted" style="font-size:11px;margin-top:15px">Current saved status: <b>${esc(normalizeAttendanceRecord(old).attendance_status)}</b></p>` : ""}</div>`);
        window.modalEvent = e;
      };
      title = function (v) { return v === "daily" ? "Daily Schedule" : v === "attendance" ? "Attendance Up to Date" : ({ simulator: "Attendance simulator", reminders: "Reminders", profile: "Your profile", timetable: "Weekly timetable", onboarding: "Set up PC13" }[v] || "PC13"); };
      viewMarkup = function () { if (view === "onboarding") return onboarding(); if (view === "daily") return dailyScheduleView(); if (view === "attendance") return attendanceView(); if (view === "simulator") return simulator(); if (view === "reminders") return remindersView(); if (view === "profile") return profileView(); if (view === "timetable") return timetableView(); if (selectedSubject) return subjectView(selectedSubject); return attendanceView(); };
      simulationUpdate = function () {
        const c = Number($("sim-count")?.value || 5), mode = $("sim-mode")?.value || "present", o = overall(), simulatedConducted = mode === "mixed" ? Math.ceil(c / 2) : c, simulatedAttended = mode === "present" ? c : mode === "mixed" ? Math.ceil(c / 2) : 0, conductedTotal = o.conducted + simulatedConducted, attendedTotal = o.attended + simulatedAttended, projected = conductedTotal ? (attendedTotal / conductedTotal) * 100 : null;
        if ($("sim-label")) $("sim-label").textContent = c + " class" + (c === 1 ? "" : "es"); if ($("sim-current")) $("sim-current").textContent = o.pct == null ? "—" : pctText(o.pct); if ($("sim-project")) $("sim-project").textContent = projected == null ? "—" : pctText(projected); if ($("sim-copy")) $("sim-copy").textContent = `Projected from ${attendedTotal} attended / ${conductedTotal} conducted. Actual browser records are unchanged.`;
      };
      const countBindCore = bind;
      bind = function () { countBindCore(); $("attendance-date")?.addEventListener("change", (ev) => { selectedDate = ev.target.value || localDate(); render(); }); };

      boot();
    </script>
  
<!-- PC13 FRONTEND CONTRACT
     Attendance: total attended / total conducted * 100
     Lecture and lab sessions each count as one attendance unit.
     Present = attended +1, conducted +1
     Absent = conducted +1
     Not Conducted = no attendance change
     Future sessions are excluded from current attendance.
     This prototype intentionally uses browser storage; production persistence
     will be connected through Supabase later.
-->
